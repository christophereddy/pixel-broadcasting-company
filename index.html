<title>Pixel Broadcasting Company</title>

<style>
/* Layout: a broadcast monitor in a dark control room, rundown and cast cards below. Single dark look by design. */
:root{
  --room:#0a0c18; --panel:#131733; --line:#272d5c; --text:#eceefa; --muted:#9ba3cc;
  --gold:#f2b632; --live:#e5383b; --navy:#1d2766;
  --f-display:"Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --f-label:"Silkscreen", "Courier New", monospace;
  --f-body:"VT323", "Courier New", ui-monospace, monospace;
  color-scheme:dark;
}
html,body{height:auto}
body{margin:0;background:var(--room);color:var(--text);font-family:var(--f-body);font-size:20px;line-height:1.25}
.page{max-width:1400px;margin:0 auto;padding:12px 16px 32px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr) 300px;grid-template-areas:"head head" "main side"}
.top{grid-area:head;display:flex;flex-direction:column;gap:12px;min-width:0}
.main{grid-area:main;display:flex;flex-direction:column;gap:12px;min-width:0}
.side{grid-area:side;align-self:start;display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:900px){.page{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "main" "side"}}
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand>div{min-width:0}
.mark{font-family:var(--f-label);background:var(--gold);color:var(--navy);padding:6px 8px;font-size:18px;letter-spacing:.06em;box-shadow:3px 3px 0 var(--navy)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3.4vw,34px);margin:0;line-height:1.05;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:19px}
.onair{font-family:var(--f-label);font-size:13px;letter-spacing:.08em;color:var(--text);display:flex;align-items:center;gap:8px;border:2px solid var(--line);padding:6px 10px}
.mastside{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.nextref{box-sizing:border-box;display:flex;align-items:center;gap:10px;height:36px;white-space:nowrap;border:2px solid var(--line);background:var(--panel);padding:5px 12px;line-height:1.1}
.nlabel{font-family:var(--f-label);font-size:11px;letter-spacing:.08em;color:var(--gold)}
#nextTime{font-size:19px;color:var(--text);font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;background:var(--live);display:inline-block;animation:pulse 1.6s steps(2) infinite}
@keyframes pulse{50%{opacity:.25}}

.screen{box-sizing:border-box;position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000;border:4px solid #2c3364;box-shadow:0 0 0 4px #05060d;container-type:inline-size;overflow:hidden}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.ov{position:absolute;inset:0;pointer-events:none}
.bug{position:absolute;left:2.4cqw;top:2.4cqw;display:flex;align-items:stretch;font-family:var(--f-label);font-size:1.9cqw;line-height:1}
.bug b{background:var(--gold);color:var(--navy);padding:.45em .5em;font-weight:400}
.bug .live{background:var(--live);color:#fff;padding:.45em .5em}
.seg{position:absolute;left:2.4cqw;top:6.4cqw;font-family:var(--f-label);font-size:1.5cqw;color:#fff;background:#0b0e24cc;padding:.35em .55em;letter-spacing:.06em}
.clock{position:absolute;right:2.4cqw;top:2.4cqw;font-family:var(--f-label);font-size:1.7cqw;background:#0b0e24d9;color:#fff;padding:.5em .6em;font-variant-numeric:tabular-nums}
.third{position:absolute;left:2.4cqw;right:2.4cqw;bottom:6.6cqw;display:flex;flex-direction:column;align-items:flex-start}
.plate{display:flex;font-family:var(--f-label);font-size:1.45cqw;line-height:1}
.plate span{padding:.45em .6em}
#pname{background:var(--gold);color:var(--navy)}
#prole{background:var(--navy);color:#fff}
.hl{display:flex;align-items:stretch;background:#f4f5fb;color:#11163a;width:100%;min-width:0}
.chip{font-family:var(--f-label);font-size:1.45cqw;background:var(--live);color:#fff;padding:.7em .7em;display:flex;align-items:center;white-space:nowrap;letter-spacing:.04em}
#head{font-family:var(--f-display);font-weight:700;font-size:2.6cqw;padding:.22em .5em;line-height:1.1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sum{margin:0;background:#0b0e24e6;color:#eef0fb;font-family:var(--f-body);font-size:2.35cqw;line-height:1.12;padding:.25em .6em .35em;width:100%;min-height:2.6em}
.ticker{position:absolute;left:0;right:0;bottom:0;height:4.6cqw;display:flex;background:var(--navy);border-top:.3cqw solid var(--gold)}
.tlabel{font-family:var(--f-label);font-size:1.45cqw;background:var(--gold);color:var(--navy);display:flex;align-items:center;padding:0 1em;white-space:nowrap;z-index:1}
.tw{position:relative;flex:1;overflow:hidden}
.tt{position:absolute;top:0;bottom:0;left:0;display:flex;align-items:center;white-space:nowrap;font-family:var(--f-body);font-size:2.5cqw;color:#fff;will-change:transform}
.tt i{font-style:normal;color:var(--gold);padding:0 .8em}
#fs{position:absolute;right:2.4cqw;top:7.2cqw;font-family:var(--f-label);font-size:max(10px,1.2cqw);background:#0b0e24cc;color:#fff;border:2px solid #ffffff55;padding:.4em .7em;cursor:pointer;pointer-events:auto}
#fs:hover,#snd:hover{border-color:var(--gold)}
#snd{position:absolute;right:2.4cqw;top:11.6cqw;font-family:var(--f-label);font-size:max(10px,1.2cqw);background:#0b0e24cc;color:#fff;border:2px solid #ffffff55;padding:.4em .7em;cursor:pointer;pointer-events:auto}
#snd:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#snd.on{border-color:var(--gold);color:var(--gold)}
#fs:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.screen:fullscreen,.screen.theater{border:0;box-shadow:none;width:100vw;height:100vh;max-width:none;aspect-ratio:auto;container-type:size}
.screen.theater{position:fixed;inset:0;z-index:100;height:100%}
.screen:fullscreen canvas,.screen:fullscreen .ov,.screen.theater canvas,.screen.theater .ov{inset:auto;width:min(100cqw,177.78cqh);height:min(56.25cqw,100cqh);left:50%;top:50%;transform:translate(-50%,-50%)}
.screen:fullscreen .ov,.screen.theater .ov{container-type:inline-size}
body.theater-on{overflow:hidden}
.below{display:none;margin:0;background:var(--panel);border:2px solid var(--line);padding:10px 12px;font-size:19px}
.below b{font-family:var(--f-display);font-weight:700;display:block;font-size:20px;margin-bottom:4px}
@container (max-width:600px){
  .sum{display:none}
  #head{font-size:3.6cqw}
}
@media (max-width:640px){ .below{display:block} }

.edline{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;height:27px;white-space:nowrap;min-width:0}
#city{flex:0 1 auto;min-width:0;height:27px;font-family:var(--f-body);font-size:19px;line-height:1.1;max-width:100%;background:var(--room);color:var(--text);border:2px solid var(--line);padding:1px 4px;cursor:pointer}
#city:hover{border-color:var(--gold)}
#city:focus-visible{outline:none;border-color:var(--gold)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.findp{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:2px solid var(--line);padding:10px 12px}
.findp[hidden]{display:none}
.findrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#find{flex:1 1 240px;min-width:0;font-family:var(--f-body);font-size:20px;background:var(--room);color:var(--text);border:2px solid var(--line);padding:4px 10px}
#find:focus-visible{outline:none;border-color:var(--gold)}
#findBtn,#findX{font-family:var(--f-label);font-size:13px;border:0;padding:8px 14px;cursor:pointer;white-space:nowrap}
#findBtn{background:var(--gold);color:var(--navy);box-shadow:3px 3px 0 var(--navy)}
#findX{background:transparent;color:var(--muted);border:2px solid var(--line)}
#findBtn:focus-visible,#findX:focus-visible{outline:3px solid var(--text);outline-offset:2px}
#findBtn:disabled{opacity:.6;cursor:default}
.locstatus{margin:0;color:var(--muted);font-size:18px}
.locstatus.warn{color:#ffb4a8}
.card{background:var(--panel);border:2px solid var(--line);padding:14px 16px;min-width:0}
h2{font-family:var(--f-label);font-weight:400;font-size:14px;letter-spacing:.1em;color:var(--gold);margin:0 0 10px}
ol,ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
#rundown li{display:flex;flex-direction:column;gap:0;padding:4px 8px;font-variant-numeric:tabular-nums}
#rundown li .tm{color:var(--muted);white-space:nowrap}
#rundown li .who{display:none}
#rundown li.now{background:var(--navy)}
#rundown li.now .tm{color:var(--gold)}
#rundown li .tm{font-size:16px;line-height:1.1}
#rundown li.now .tm::after{content:" NOW";font-family:var(--f-label);font-size:10px;color:var(--live)}
#rundown .pk{all:unset;cursor:pointer;color:var(--text);text-decoration:underline dotted 1px;text-underline-offset:3px;min-width:0}
#rundown .pk:hover{color:var(--gold)}
#rundown .pk:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#rundown li.picked{background:#3a1420}
#rundown li.picked .tm::after{content:" NEXT";font-family:var(--f-label);font-size:10px;color:var(--gold)}
.rdhint{margin:0 0 6px;color:var(--muted);font-size:16px}
#cast li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;padding:3px 4px}
#cast canvas{width:42px;height:36px;image-rendering:pixelated;background:#1d2350}
#cast li.on canvas{outline:2px solid var(--live)}
#cast .nm{display:block;font-family:var(--f-display);font-weight:500;font-size:19px;line-height:1.1}
#cast .rl{color:var(--muted);font-size:17px}
#cast li.on .rl::after{content:" · on air";color:var(--live)}
footer{color:var(--muted);font-size:17px;line-height:1.35}
footer a{color:var(--text);text-decoration-color:var(--gold)}
footer a:focus-visible{outline:2px solid var(--gold)}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.topctl{display:flex;gap:10px;margin-left:auto}
.topctl #fs,.topctl #snd{position:static;font-size:13px;height:36px;line-height:1;padding:0 14px;background:var(--panel);border-color:var(--line)}
.ctl{min-height:36px}
@media (max-width:640px){
  .mastside{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px}
  .nextref{width:100%;gap:8px}.nextref .nlabel{font-size:10px}.nextref .lw{display:none}#nextTime{font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis}.nextref{padding:5px 10px}.topctl{width:100%}
  .topctl #fs,.topctl #snd{flex:1 1 0;padding:10px 8px}
}
.pbc-chan{display:flex;border:2px solid var(--line)}.pbc-chan a{font-family:var(--f-label);font-size:13px;letter-spacing:.08em;padding:6px 12px;color:var(--muted);text-decoration:none}.pbc-chan a[aria-current="page"]{background:var(--gold);color:var(--navy)}.pbc-chan a:not([aria-current]):hover{color:var(--text)}.pbc-chan a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>

<div class="page">
  <div class="top">
  <header class="mast">
    <div class="brand">
      <span class="mark" aria-hidden="true">PBC</span>
      <div><h1>Pixel Broadcasting Company</h1>
        <p class="edline"><span id="edition">On the air</span><span aria-hidden="true">·</span><label class="sr" for="city">Local desk city</label><select id="city"></select></p></div>
    </div>
    <div class="mastside">
      <nav class="pbc-chan" aria-label="Channel"><a href="./" aria-current="page">NEWS</a><a href="sports/">SPORTS</a></nav>
      <div class="onair"><span class="dot"></span>ON AIR 24 HOURS</div>
    </div>
  </header>
  <div class="ctl">
    <div class="nextref" id="nextRef"><span class="nlabel">NEXT <span class="lw">NEWS </span>REFRESH</span><span id="nextTime"></span></div>
    <div class="topctl" id="topctl"></div>
  </div>
  </div>

  <div class="main">
  <form class="findp" id="findForm" novalidate hidden>
    <label for="find" class="nlabel">CITY NOT LISTED? FIND IT</label>
    <div class="findrow">
      <input id="find" type="text" list="places" maxlength="60" placeholder="Start typing your city" autocomplete="off">
      <datalist id="places"></datalist>
      <button type="submit" id="findBtn">SET MY CITY</button>
      <button type="button" id="findX">CANCEL</button>
    </div>
    <p id="locStatus" class="locstatus" aria-live="polite"></p>
  </form>
  <div class="screen" id="screen">
    <canvas id="tv" width="384" height="216" aria-label="Pixel art newsroom broadcast"></canvas>
    <div class="ov" aria-live="polite">
      <div class="bug"><b>PBC</b><span class="live">LIVE</span></div>
      <div class="seg" id="seg"></div>
      <div class="clock" id="clock"></div>
      <div class="third">
        <div class="plate"><span id="pname"></span><span id="prole"></span></div>
        <div class="hl"><span class="chip" id="chip"></span><span id="head"></span></div>
        <p class="sum" id="sum"></p>
      </div>
      <div class="ticker"><span class="tlabel">HEADLINES</span><div class="tw" id="tw"><div class="tt" id="tt"></div></div></div>
    </div>
    <button id="fs" type="button">FULL SCREEN</button>
    <button id="snd" type="button" aria-label="Sound">SOUND: OFF</button>
  </div>
  <p class="below" id="below"><b id="belowHead"></b><span id="belowSum"></span></p>
  <footer id="foot"></footer>
  </div>

  <aside class="side">
    <div class="card"><h2>RUNDOWN</h2><p class="rdhint">Pick a segment to jump to it after the current story.</p><ol id="rundown"></ol></div>
    <div class="card"><h2>ON THE DESK</h2><ul id="cast"></ul></div>
  </aside>
</div>

function disc(cx,cy,r,c,top){g.fillStyle=c;for(let y=-r;y<=(top?0:r);y++){const w=Math.floor(Math.sqrt(r*r-y*y));g.fillRect(cx-w,cy+y,w*2+1,1)}}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function mix(a,b,k){const A=hex(a),B=hex(b);return "#"+A.map((x,i)=>Math.round(x+(B[i]-x)*k).toString(16).padStart(2,"0")).join("")}

function txt(s,x,y,c,sc){sc=sc||1;s=String(s).toUpperCase();g.fillStyle=c;for(let i=0;i<s.length;i++){const m=F[s[i]]||F[" "];for(let k=0;k<15;k++)if(m[k]==="1")g.fillRect(Math.round(x+(i*4+k%3)*sc),Math.round(y+Math.floor(k/3)*sc),sc,sc)}}

function person(look,ctx,x,y,s,st){
  st=st||{};
  const r=(col,px,py,w,h)=>{ctx.fillStyle=col;ctx.fillRect(x+px*s,y+py*s,w*s,h*s)};
  const Y=st.bob?-1:0, h=look.hair, sh="#15151c";
  if(!st.seated&&!st.headOnly){
    r(look.pants,3,22,4,8);r(look.pants,7,22,4,8);
    r(look.shoe||sh,2,30,5,2);r(look.shoe||sh,7,30,5,2);
  }
  if(!st.headOnly){
    r(look.coat,1,12,12,10);
    if(look.dress){r(look.coat,2,22,10,4)}
    r(mix(look.coat,"#000000",.25),1,12,1,10);
    r(look.shirt,5,12,4,2);r(look.shirt,6,14,2,1);
    if(look.tie)r(look.tie,6,13,2,6);
    r(look.coat,0,13,1,8);r(look.skin,0,21,1,1);
    if(st.point){r(look.coat,13,12,6,2);r(look.skin,19,12,2,2)}
    else if(st.mic){r(look.coat,12,13,2,4);r(look.coat,11,12,2,2);r(look.skin,10,10,2,2);r("#2a2a33",10,8,2,2);r("#c9ccd6",10,7,2,1);r("#f2b632",9,9,1,1)}
    else{r(look.coat,13,13,1,8);r(look.skin,13,21,1,1)}
    if(st.seated){r(look.skin,3,20,2,1);r(look.skin,9,20,2,1)}
  }
  r(look.skin,6,10,2,2);
  // back hair
  if(look.style==="long")r(h,1,2+Y,12,11);
  if(look.style==="curly"){r(h,1,1+Y,12,8);r(h,0,3+Y,14,5)}
  if(look.style==="bob")r(h,2,2+Y,10,8);
  if(look.style==="pony"){r(h,11,3+Y,3,3);r(h,12,6+Y,2,5)}
  if(look.style==="wild"){r(h,0,-1+Y,14,12);r(h,-1,1+Y,16,8);r(h,1,-2+Y,4,1);r(h,9,-2+Y,4,1);r(h,-2,4+Y,1,3);r(h,15,3+Y,1,4);r(h,1,11+Y,2,2);r(h,11,11+Y,2,2)}
  // face
  r(look.skin,3,2+Y,8,9);r(look.skin,2,5+Y,1,2);r(look.skin,11,5+Y,1,2);
  r(mix(look.skin,"#000000",.12),3,10+Y,8,1);
  // eyes
  if(!st.blink){r("#1b1b25",5,5+Y,1,1);r("#1b1b25",8,5+Y,1,1)}else{r(mix(look.skin,"#000000",.3),5,5+Y,1,1);r(mix(look.skin,"#000000",.3),8,5+Y,1,1)}
  // glasses: thin dark frames around each eye with a bridge, and a faint lens glint
  if(look.glasses){const fr="#3a3440";r(fr,4,4+Y,2,1);r(fr,8,4+Y,2,1);r(fr,4,5+Y,1,1);r(fr,6,5+Y,2,1);r(fr,9,5+Y,1,1);r(fr,4,6+Y,2,1);r(fr,8,6+Y,2,1);
    if(!st.blink){r("#9fb8d8",5,6+Y,1,1);r("#9fb8d8",8,6+Y,1,1)}}
  // front hair
  if(look.style==="short"||look.style==="beard"||look.style==="pony"){r(h,3,1+Y,8,2);r(h,2,2+Y,1,3);r(h,11,2+Y,1,3);r(h,3,3+Y,1,1);r(h,10,3+Y,1,1)}
  if(look.style==="pony")r(h,3,3+Y,4,1);
  if(look.style==="long"){r(h,3,1+Y,8,2);r(h,2,2+Y,1,5);r(h,11,2+Y,1,5);r(h,3,3+Y,3,1)}
  if(look.style==="curly"){r(h,2,0+Y,10,2);r(h,3,2+Y,8,1);r(mix(h,"#ffffff",.15),4,0+Y,1,1);r(mix(h,"#ffffff",.15),9,1+Y,1,1)}
  if(look.style==="wild"){r(h,3,0+Y,8,2);r(h,2,2+Y,2,4);r(h,10,2+Y,2,4);r(h,4,2+Y,2,1);r(h,8,2+Y,1,1);r(mix(h,"#ffffff",.25),5,0+Y,1,1);r(mix(h,"#ffffff",.25),1,4+Y,1,1);r(mix(h,"#ffffff",.25),12,6+Y,1,1)}
  if(look.earring){r(look.earring,2,8+Y,1,1);r(look.earring,11,8+Y,1,1)}
  if(look.style==="bob"){r(h,3,1+Y,8,2);r(h,3,3+Y,8,1);r(h,2,2+Y,1,8);r(h,11,2+Y,1,8)}
  if(look.style==="beard"){r(h,3,8+Y,1,3);r(h,10,8+Y,1,3);r(h,3,10+Y,8,1);r(h,5,7+Y,4,1)}
  // mouth
  if(st.open)r("#4a1418",6,8+Y,2,2);else r(mix(look.skin,"#5a1a1a",.55),6,8+Y,2,1);
}
function anim(key,t,speaking,phase){
  const seed=key.charCodeAt(0)*977;
  const blink=((t+seed)%3700)<130;
  let open=false,bob=false;
  if(speaking&&phase<.9){
    const pause=Math.sin(t/650+seed)>.82;
    open=!pause&&((Math.floor(t/105)*7+seed)%5)>1;
    bob=Math.floor((t+seed)/900)%3===0;
  }
  return {blink,open,bob};
}

/* ---------- sky + scenery ---------- */
const SKY=[[0,"#070a1f","#141a3d"],[5,"#0b1030","#2a2350"],[6.5,"#3b4a8a","#f39a6b"],[8,"#5aa7e0","#bfe3f5"],[16.5,"#4f9ad8","#c8e6f5"],[18.6,"#4a4f9a","#f08a5d"],[20,"#1a1d4a","#5a3a6a"],[21.5,"#0a0d26","#1b2045"],[24,"#070a1f","#141a3d"]];
function skyCols(hr){for(let i=0;i<SKY.length-1;i++){const a=SKY[i],b=SKY[i+1];if(hr>=a[0]&&hr<=b[0]){const k=(hr-a[0])/(b[0]-a[0]);return [mix(a[1],b[1],k),mix(a[2],b[2],k)]}}return [SKY[0][1],SKY[0][2]]}
function isNight(hr){return hr<6||hr>=19.5}
function sky(x,y,w,h,hr,t){
  const [a,b]=skyCols(hr);const n=8;
  for(let i=0;i<n;i++)R(mix(a,b,i/(n-1)),x,y+Math.floor(h*i/n),w,Math.ceil(h/n)+1);
  if(isNight(hr)){const q=rng(7);for(let i=0;i<w*h/180;i++){const sx=x+Math.floor(q()*w),sy=y+Math.floor(q()*h*.7);if(((t/400+i)|0)%9)R("#ffffff",sx,sy,1,1)}
    disc(x+w-18,y+12,5,"#f4f1d8");disc(x+w-16,y+11,4,a);}
  else if(hr>=6&&hr<19.5){const k=(hr-6)/13.5;disc(x+Math.round(w*(.1+.8*k)),y+Math.round(h*.7-Math.sin(k*Math.PI)*h*.55),6,"#ffe27a")}
}
function skyline(x,y,w,h,hr,seed,col){
  const q=rng(seed),night=isNight(hr);let bx=x;
  while(bx<x+w){const bw=8+Math.floor(q()*14),bh=Math.floor(h*(.35+q()*.65));R(col,bx,y+h-bh,bw,bh);
    for(let wy=y+h-bh+3;wy<y+h-2;wy+=4)for(let wx=bx+2;wx<bx+bw-2;wx+=3){if(q()<(night?.45:.25))R(night?"#ffd77a":mix(col,"#ffffff",.25),wx,wy,1,2)}
    if(q()<.2)R(col,bx+Math.floor(bw/2),y+h-bh-5,1,5);
    bx+=bw+1}
}
function icon(kind,x,y,t){
  if(kind==="sun"){disc(x+6,y+6,4,"#ffd23a");const k=Math.floor(t/400)%2;g.fillStyle="#ffd23a";[[6,-1],[6,12],[-1,6],[12,6]].forEach(p=>g.fillRect(x+p[0],y+p[1]+(k&&p[1]>6?-1:0),1,2));return}
  if(kind==="moon"){disc(x+6,y+6,4,"#f4f1d8");disc(x+8,y+5,3,"#0f3d6e");return}
  if(kind==="pcloud"){disc(x+8,y+4,3,"#ffd23a")}
  R("#e9eef6",x+1,y+4,11,4);R("#e9eef6",x+3,y+2,6,2);R("#c4ccdb",x+1,y+7,11,1);
  if(kind==="rain"||kind==="storm"){for(let i=0;i<3;i++){const dy=((t/120+i*3)|0)%5;R("#5fb4ff",x+2+i*4,y+9+dy,1,2)}}
  if(kind==="storm"){if(Math.floor(t/300)%4===0){R("#ffe14a",x+6,y+8,2,2);R("#ffe14a",x+5,y+10,2,2);R("#ffe14a",x+6,y+12,1,2)}}
}
function wxKind(text,name){
  const s=(text||"").toLowerCase(),night=/night|tonight/i.test(name||"");
  if(/thunder|storm/.test(s))return "storm";
  if(/rain|shower|drizzle/.test(s))return "rain";
  if(/partly|mostly sunny|increasing|becoming|gradually/.test(s))return "pcloud";
  if(/cloud|overcast|fog/.test(s))return "cloud";
  return night?"moon":"sun";
}

    pol.forEach(s=>say(B,s,{seg:"Politics desk",sp:"P",shot:"P",cat:"ANALYSIS",wall:"politics"}))}
  pick(D.business,99,c).forEach(s=>say(B,s,{seg:"Business",sp:"B",scene:"ots",cat:"BUSINESS",wall:"business"}));
  const lo=pick(D.local,99,c);
  if(lo.length){B.push({seg:"Local desk",sp:"A",shot:"A",cat:"LOCAL",head:"Around "+loc,body:"Jess Riley is out in the city with the local stories. Jess?",wall:"local"});
    lo.forEach(s=>say(B,s,{seg:"Local desk",sp:"L",scene:"local",cat:"LIVE · "+String(s.place||D.location.short||"LOCAL").toUpperCase()}))}
  const w=D.weather,ps=w.periods||[];
  if(w&&(w.now||ps.length))B.push({seg:"Weather",sp:"B",shot:"two",cat:"WEATHER",head:"Weather with Sunny Okafor",body:"Sunny, what does the sky have in store?",wall:"weather"});
  const n=nowWx();let i0=0;
  if(!(w&&(w.now||ps.length))){}
  else if(!n.fromPeriod)B.push({seg:"Weather",sp:"W",scene:"wx",cat:"WEATHER",head:"Right now in "+loc+": "+n.temp+"° and "+String(n.cond).toLowerCase(),body:"Wind "+n.wind+", humidity "+n.humidity+"%. Observed "+n.obs+"."});
  else if(ps.length){i0=1;B.push({seg:"Weather",sp:"W",scene:"wx",cat:"WEATHER",head:ps[0].name+" in "+loc+": "+ps[0].kind+" "+ps[0].temp+"°",body:ps[0].text})}
  for(let i=i0;i<i0+4&&i<ps.length;i+=2){const a=ps[i],b2=ps[i+1];
    B.push({seg:"Weather",sp:"W",scene:"wx",cat:"FORECAST",head:a.name+": "+a.kind+" "+a.temp+"°"+(b2?" · "+b2.name+": "+b2.kind+" "+b2.temp+"°":""),body:a.text+(b2?" "+b2.name+": "+b2.text:"")})}
  const sci=pick(D.science,99,c);
  if(sci.length){B.push({seg:"Science",sp:"A",shot:"A",cat:"SCIENCE",head:"Science with Juniper Wilde",body:"Juniper, where is the science taking us today?",wall:"science"});
    sci.forEach(s=>say(B,s,{seg:"Science",sp:"X",scene:"lab",cat:"SCIENCE",topic:sciTopic(s.h)}));
    B.push({seg:"Science",sp:"X",scene:"lab",cat:"SCIENCE",head:"That's science for now!",body:"Stay curious, ask big questions, and go find out for yourself.",topic:"atom"})}
  const spo=pick(D.sports,99,c);
  if(spo.length){B.push({seg:"Sports",sp:"A",shot:"two",cat:"SPORTS",head:"Sports with Bo Kowalski",body:"Bo, what's the latest?",wall:"sports"});
    spo.forEach(s=>say(B,s,{seg:"Sports",sp:"S",shot:"S",cat:"SPORTS",wall:"sports"}))}
  // Good News only airs when a refresh found some.
  const good=[].concat(D.goodnews||[],D.localgood||[]).filter(s=>s&&s.h&&s.b);
  if(good.length){B.push({seg:"Good News",sp:"B",shot:"two",cat:"GOOD NEWS",head:"Some good news",body:"Before we go, Rosa, I hear we found some good news today.",wall:"goodnews"});
    good.forEach((s,i)=>say(B,s,{seg:"Good News",sp:i%2?"B":"A",shot:i%2?"B":"A",cat:"GOOD NEWS",wall:"goodnews"}))}
  B.push({seg:"Sign-off",sp:"B",shot:"wide",cat:"PBC NEWS",head:"That's the news for now.",body:"Pixel Broadcasting Company never signs off. Stay with us for the next round of headlines.",wall:"logo"});
  return B;
}
const SHOTS={wide:[0,0],two:[74,58],A:[51,62],B:[97,62],P:[149,62],W:[192,34],wwide:[160,22],S:[0,74]};

/* ---------- overlay ---------- */
const $=id=>document.getElementById(id);
function buildTicker(){
  const tt=$("tt");tt.textContent="";
  const items=[].concat(D.world||[],D.national||[],D.politics||[],D.business||[],D.local||[],D.international||[],D.science||[],D.sports||[]).map(s=>s.h).concat([].concat(D.goodnews||[],D.localgood||[]).map(s=>"Good news: "+s.h));
  const nw=nowWx();items.push(D.location.name+" weather: "+nw.temp+"° "+String(nw.cond).toLowerCase());

function buildCast(){

    const c=document.createElement("canvas");c.width=14;c.height=12;const cx=c.getContext("2d");cx.fillStyle="#1d2350";cx.fillRect(0,0,14,12);person(CAST[k].look,cx,0,0,1,{headOnly:true});
    const d=document.createElement("div");const n=document.createElement("span");n.className="nm";n.textContent=CAST[k].name;const r=document.createElement("span");r.className="rl";r.textContent=CAST[k].role;d.append(n,r);

function buildFoot(){

  (D.sources||[]).forEach((s,i)=>{if(i)f.append(", ");if(/^https:\/\//.test(s.url)){const a=document.createElement("a");a.href=s.url;a.target="_blank";a.rel="noopener";a.textContent=s.name;f.appendChild(a)}else f.append(s.name)});
}
let beatCount=1;
function onData(){compose();dataVer++;cache=null;beatCount=buildBeats(0,0).length;buildTicker();buildFoot()}

/* ---------- sound ---------- */
const MODES=["off","blips","voices"],MODE_LABEL={off:"SOUND: OFF",blips:"SOUND: BLIPS",voices:"SOUND: VOICES"};
let mode="off",ac=null,lastOpen=false,spokenKey="";
function setMode(m){mode=m;talking=false;const b=$("snd");b.textContent=MODE_LABEL[m];b.classList.toggle("on",m!=="off");try{if("speechSynthesis" in window)speechSynthesis.cancel()}catch(e){}spokenKey=""}
function blip(k){
  if(!ac)return;const v=VOICE[k]||VOICE.A,t0=ac.currentTime,o=ac.createOscillator(),gn=ac.createGain();
  o.type="square";o.frequency.value=v.hz*(0.9+Math.random()*0.25);
  gn.gain.setValueAtTime(0.0001,t0);gn.gain.exponentialRampToValueAtTime(0.035,t0+0.008);gn.gain.exponentialRampToValueAtTime(0.0001,t0+0.07);
  o.connect(gn).connect(ac.destination);o.start(t0);o.stop(t0+0.08);
}
/* Spoken voices hold the story on screen until the reading ends. Network voices
   (like Chrome's "Google" voices) stop partway through long text, so only voices
   that run on the device are used. */
let offset=0,talking=false,talkStart=0,curBeat=null,curKey="";
// Apple's novelty voices (Bells, Zarvox...) sound broken on an iPhone, so skip them.
const NOVELTY=/^(albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|deranged|hysterical|pipe organ)\b/i;
try{if(window.speechSynthesis){speechSynthesis.getVoices();speechSynthesis.addEventListener&&speechSynthesis.addEventListener("voiceschanged",()=>speechSynthesis.getVoices())}}catch(e){}
function speak(b,key){
  if(spokenKey===key)return;spokenKey=key;talking=false;
  // iPhone Safari drops a speak() that comes right after cancel(), so only cancel when something is playing.
  try{const ss=window.speechSynthesis;if(!ss)return;if(ss.speaking||ss.pending)ss.cancel();
    const u=new SpeechSynthesisUtterance(b.cont?b.body:b.head+". "+b.body),v=VOICE[b.sp]||VOICE.A;u.pitch=v.pitch;u.rate=v.rate;u.volume=.9;
    const all=ss.getVoices().filter(x=>/^en/i.test(x.lang)&&!NOVELTY.test(x.name)),local=all.filter(x=>x.localService);
    const vs=local.length?local:all;if(vs.length)u.voice=vs[ORDER.indexOf(b.sp)%vs.length];
    u.onend=u.onerror=()=>{if(spokenKey===key)talking=false};
    talking=true;talkStart=Date.now();ss.speak(u)}catch(e){talking=false}
}
$("snd").addEventListener("click",()=>{
  const next=MODES[(MODES.indexOf(mode)+1)%MODES.length];
  if(next!=="off"&&!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){ac=null}}
  if(ac&&ac.state==="suspended")ac.resume().catch(()=>{});
  if(next==="voices"&&!("speechSynthesis" in window)){setMode("off");return}
  setMode(next);try{localStorage.setItem("pbc-sound",next)}catch(e){}
  // iPhone and iPad only allow speech that starts inside a tap, so start the current story right here.
  if(next==="voices"&&curBeat)speak(curBeat,curKey);
});

/* A feed can override the schedule with refresh: {tz, everyHours}. */
function nextRefresh(now){
  // Refreshes run at midnight Eastern, then every 3 hours (12, 3, 6, 9 AM/PM).
  const r=(FEED&&FEED.refresh)||{},every=Math.max(1,Math.min(24,+r.everyHours||3)),tz=r.tz||"America/New_York";
  let hf;try{hf=new Intl.DateTimeFormat("en-US",{timeZone:tz,hour:"numeric",hourCycle:"h23"});}catch(e){hf=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",hour:"numeric",hourCycle:"h23"});}
  let t=Math.floor(now/3600000)*3600000+3600000;
  for(let i=0;i<27;i++,t+=3600000){if((+hf.format(t))%every===0)return t;}
  return t;
}
let cache=null;
function beatsFor(c,startMs){if(!cache||cache.c!==c||cache.v!==dataVer)cache={c,v:dataVer,B:buildBeats(c,startMs)};return cache.B}
let lastBeatKey="",lastChars=-1,lastDraw=0,lastRundown=0;
const BUMP=5000;let pickSeg=null,bump=null,lastNormalKey="",lastRd=null;
function bumperBeat(p){return {seg:"Change of plans",sp:"A",shot:"wide",cat:"VIEWER'S PICK",wall:"logo",head:"Change of plans: "+p.seg,body:"A viewer wants "+p.seg.toLowerCase()+", so we're breaking away to it now. Stay with us."}}
function drawBumper(t){
  const on=Math.floor(t/350)%2;
  R(on?"#c8102e":"#a50d26",0,40,W,34);R("#f2b632",0,40,W,2);R("#f2b632",0,72,W,2);
  txtC("CHANGE OF PLANS",W/2,46,"#ffffff",3);txtC("BY VIEWER REQUEST",W/2,65,"#f2b632",1);
}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function frame(){
  requestAnimationFrame(frame);
  const real=Date.now();if(real-lastDraw<50)return;lastDraw=real;
  let t=real+offset;
  const cycleLen=beatCount*BEAT,c=Math.floor(t/cycleLen),cycleStart=c*cycleLen;
  const B=beatsFor(c,cycleStart),idx=Math.floor((t-cycleStart)/BEAT);let b=B[idx]||B[0],phase=((t-cycleStart)%BEAT)/BEAT;
  if(mode==="voices"&&talking&&!bump){
    if(real-talkStart>45000||(window.speechSynthesis&&!speechSynthesis.speaking&&!speechSynthesis.pending&&real-talkStart>1500))talking=false;
    else if(phase>.95){phase=.95;offset=cycleStart+idx*BEAT+.95*BEAT-real;t=real+offset}
  }
  // Viewer's pick: when the next story starts, cut to a "change of plans" bumper, then jump to the picked segment.
  const nkey=c+":"+idx;
  if(pickSeg&&!bump&&lastNormalKey&&nkey!==lastNormalKey&&!b.cont){
    bump={start:real,target:pickSeg.start,seg:pickSeg.seg,c};pickSeg=null;if(mode==="voices")talking=false}
  lastNormalKey=nkey;
  if(bump){
    const el=real-bump.start;
    if(el>=BUMP&&!(mode==="voices"&&talking&&el<20000)){
      offset=cycleStart+bump.target*BEAT-real;bump=null;talking=false;lastNormalKey="";return}
    b=bumperBeat(bump);phase=Math.min(1,el/BUMP);
  }
  const dp=mode==="voices"&&talking?Math.min(phase,.5):phase;
  if(b.scene==="lab")drawLab(real,b,dp);else if(b.scene==="ots")drawOts(real,b,dp);else if(b.scene==="intl")drawIntl(real,b,dp);else if(b.scene==="wx")drawWx(real,b,dp);else if(b.scene==="local")drawLocal(real,b,dp);else drawStudio(real,b,dp);
  if(bump)drawBumper(real);
  const s=b.scene?[0,0,1]:(SHOTS[b.shot]||[0,0]);const z=b.scene||b.shot==="wide"?1:2;
  const lift=18;v.drawImage(scene,s[0],s[1]+lift/z,W/z,(H-lift)/z,0,0,W,H-lift);v.fillStyle="#1d2766";v.fillRect(0,H-lift,W,lift);
  const key=bump?"bump"+bump.start:c+":"+idx;
  if(key!==lastBeatKey){lastBeatKey=key;lastChars=-1;
    $("pname").textContent=CAST[b.sp].name.toUpperCase();$("prole").textContent=CAST[b.sp].role.toUpperCase();
    $("chip").textContent=b.cat;$("head").textContent=b.head;$("seg").textContent=b.seg.toUpperCase();
    $("belowHead").textContent=b.head;$("belowSum").textContent=b.body;
    document.querySelectorAll("#cast li").forEach(li=>li.classList.toggle("on",li.dataset.k===b.sp));
    lastRd=[B,cycleStart,cycleLen,idx];renderRundown(B,cycleStart,cycleLen,idx);
  }
  const n=reduce?b.body.length:Math.min(b.body.length,Math.floor(b.body.length*phase/.6));
  if(n!==lastChars){lastChars=n;$("sum").textContent=b.body.slice(0,n)}
  if(mode==="blips"){const o=anim(b.sp,real,true,phase).open;if(o&&!lastOpen)blip(b.sp);lastOpen=o}
  else if(mode==="voices")speak(b,key);
  curBeat=b;curKey=key;
  if(real-lastRundown>1000){lastRundown=real;
    const hr=hourIn(D.location.tz);
    $("clock").textContent=fmt(real,{hour:"numeric",minute:"2-digit",timeZoneName:"short"})+" · "+(D.location.short||"")+" "+nowWx().temp+"°";
    $("edition").textContent=edition(hr)+" edition";
    const nr=nextRefresh(real),mins=Math.max(0,Math.round((nr-real)/60000));
    $("nextTime").textContent=fmt(nr,{hour:"numeric",minute:"2-digit",timeZoneName:"short"})+" · in "+(mins>=60?Math.floor(mins/60)+"h "+(mins%60)+"m":mins+"m");
  }
  const wrap=$("tw").clientWidth,tt=$("tt"),half=tt.scrollWidth/2||1;
  tt.style.transform=reduce?"none":"translateX("+(-((real/1000*Math.max(26,wrap/15))%half))+"px)";
}
function renderRundown(B,cycleStart,cycleLen,idx){
  const segs=[];B.forEach((b,i)=>{const last=segs[segs.length-1];if(!last||last.seg!==b.seg)segs.push({seg:b.seg,start:i,end:i,sp:b.sp});else{last.end=i;if(b.sp!==B[last.start].sp&&!last.field)last.sp2=b.sp}});
  const now=Date.now()+offset; // show time; offset moves when voices run long or a viewer picks a segment
  const rows=segs.map(s=>{let st=cycleStart+s.start*BEAT,en=cycleStart+(s.end+1)*BEAT;const on=idx>=s.start&&idx<=s.end;if(en<=now&&!on)st+=cycleLen;return Object.assign({st,on},s)}).sort((a,b)=>a.st-b.st);
  const ol=$("rundown");ol.textContent="";
  rows.forEach(r=>{const li=document.createElement("li");if(r.on)li.className="now";
    const tm=document.createElement("span");tm.className="tm";tm.textContent=fmt(r.st-offset,{hour:"numeric",minute:"2-digit",second:"2-digit"});
    let nm;
    if(r.on||bump){nm=document.createElement("span");nm.textContent=r.seg}
    else{nm=document.createElement("button");nm.type="button";nm.className="pk";nm.textContent=r.seg;
      nm.setAttribute("aria-label","Jump to "+r.seg+" after the current story");
      nm.addEventListener("click",()=>{pickSeg=(pickSeg&&pickSeg.start===r.start)?null:{start:r.start,seg:r.seg};if(lastRd)renderRundown(...lastRd)})}
    if(pickSeg&&pickSeg.start===r.start&&!r.on)li.className="picked";
    const who=document.createElement("span");who.className="who";const k=r.sp2||r.sp;who.textContent=CAST[k].name;
    li.append(tm,nm,who);ol.appendChild(li)});
}

/* ---------- full screen ---------- */
function setTheater(on){
  $("screen").classList.toggle("theater",on);document.body.classList.toggle("theater-on",on);
  $("fs").textContent=on?"EXIT FULL SCREEN":"FULL SCREEN";if(window.__placeCtl)window.__placeCtl();
}
$("fs").addEventListener("click",async()=>{
  const el=$("screen");
  if(el.classList.contains("theater")||document.fullscreenElement){
    setTheater(false);try{if(document.fullscreenElement)await document.exitFullscreen()}catch(e){}return}
  setTheater(true);
  try{if(el.requestFullscreen)await el.requestFullscreen()}catch(e){}
  try{await navigator.wakeLock.request("screen")}catch(e){}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("screen").classList.contains("theater")&&!document.fullscreenElement)setTheater(false)});
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&$("screen").classList.contains("theater")&&window.__fsWas)setTheater(false);window.__fsWas=!!document.fullscreenElement});

/* ---------- live feed from the shared store ---------- */
function valid(d){return d&&typeof d==="object"&&d.location&&typeof d.location.name==="string"&&d.weather&&Array.isArray(d.weather.periods)&&["world","national","local","sports"].every(k=>Array.isArray(d[k]))}
function validLocal(d){return d&&typeof d==="object"&&typeof d.slug==="string"&&d.location&&typeof d.location.name==="string"&&Array.isArray(d.local)&&d.weather&&Array.isArray(d.weather.periods)}
let CITIES={},pickSlug=null;
// Cities baked in at publish time, so visitors without a sign-in can still switch desks.
try{const seeded=JSON.parse(document.getElementById("locals-data").textContent);(Array.isArray(seeded)?seeded:[]).forEach(x=>{if(validLocal(x))CITIES[x.slug]=x})}catch(e){}
try{pickSlug=localStorage.getItem("pbc-local-desk")}catch(e){}
// Status shows in the "not listed" panel; quiet notes only update it, without opening the panel.
function setStatus(m,warn,quiet){const el=$("locStatus");el.textContent=m;el.classList.toggle("warn",!!warn);if(!quiet)$("findForm").hidden=false}
function openFind(){$("findForm").hidden=false;$("locStatus").textContent="";$("find").focus()}
$("findX").addEventListener("click",()=>{$("findForm").hidden=true;$("find").value=""});
const PLACES=JSON.parse(document.getElementById("places-data").textContent);
const label=c=>c.name+", "+c.region;
(function(){const dl=$("places");PLACES.forEach(c=>{const o=document.createElement("option");o.value=label(c);dl.appendChild(o)})})();
let DB=null,pending=null;
function findPlace(q){
  const k=String(q).toLowerCase().replace(/\s+/g," ").trim();if(!k)return null;
  return PLACES.find(c=>label(c).toLowerCase()===k)||PLACES.find(c=>c.name.toLowerCase()===k)||(k.length>=3?PLACES.find(c=>label(c).toLowerCase().startsWith(k)):null);
}
$("findForm").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const c=findPlace($("find").value);
  if(!c){setStatus("Pick a city from the suggestions as you type. If yours isn't there, ask Claude in the project to add it.",true);$("find").focus();return}
  $("find").value="";pickSlug=c.id;try{localStorage.setItem("pbc-local-desk",c.id)}catch(e){}
  if(CITIES[c.id]){pending=null;fillCities();applyCity();return}
  if(!DB){setStatus(label(c)+" doesn't have a local desk yet. Pick a ready city from the list for now.",true);return}
  $("findBtn").disabled=true;
  try{const ref=DB.doc("requests/"+c.id),cur=await ref.get();
    if(!cur.exists)await ref.set({id:c.id,status:"pending",requestedAt:new Date().toISOString()});
    pending=c;setStatus("Setting up a local desk for "+label(c)+". It will be on the air after the next headline refresh, within about three hours. Showing "+D.location.name+" until then.");
  }catch(e){setStatus("Couldn't save your city. Check that you're signed in, then try again.",true)}
  $("findBtn").disabled=false;
});
function fillCities(){
  const sel=$("city"),cur=pickSlug||"";sel.textContent="";
  const list=Object.values(CITIES).sort((a,b)=>a.location.name.localeCompare(b.location.name));
  if(!list.length){const o=document.createElement("option");o.value="";o.textContent=FEED.location.name;sel.appendChild(o);
    const x=document.createElement("option");x.value="__other";x.textContent="City not listed…";sel.appendChild(x);sel.value="";return}
  list.forEach(c=>{const o=document.createElement("option");o.value=c.slug;o.textContent=c.location.name;sel.appendChild(o)});
  sel.value=CITIES[cur]?cur:(list.find(c=>c.location.name===FEED.location.name)||list[0]).slug;
  const o=document.createElement("option");o.value="__other";o.textContent="City not listed…";sel.appendChild(o);
}
function applyCity(){
  const c=CITIES[$("city").value];
  LOCAL=c?JSON.parse(JSON.stringify(c)):null;onData();
  if(c)setStatus("Local news and weather for "+c.location.name+", updated "+fmt(Date.parse(c.updatedAt)||Date.now(),{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})+".",false,true);
}
$("city").addEventListener("change",()=>{
  if($("city").value==="__other"){fillCities();if(LOCAL&&CITIES[LOCAL.slug])$("city").value=LOCAL.slug;openFind();return}
  pickSlug=$("city").value;try{localStorage.setItem("pbc-local-desk",pickSlug)}catch(e){}applyCity()});
async function connect(){
  for(let i=0;i<30&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,200));
  try{const db=window.claude&&window.claude.use?await window.claude.use("db"):null;if(!db)return;DB=db;
    db.doc("feed/current").onSnapshot(s=>{if(s.exists){const d=s.data();if(valid(d)&&d.updatedAt!==FEED.updatedAt){FEED=JSON.parse(JSON.stringify(d));onData()}}},()=>{});
    db.collection("locals").onSnapshot(q=>{const next={};q.docs.forEach(d=>{const x=d.data();if(validLocal(x))next[x.slug]=x});CITIES=next;
      if(!pending&&pickSlug&&!CITIES[pickSlug]){const c=PLACES.find(p=>p.id===pickSlug);if(c)pending=c}
      if(pending&&CITIES[pending.id]){pickSlug=pending.id;pending=null}
      fillCities();applyCity();
      if(pending)setStatus("Setting up a local desk for "+label(pending)+". It will be on the air after the next headline refresh, within about three hours. Showing "+D.location.name+" until then.")},()=>{});
  }catch(e){}
}
fillCities();if(CITIES[$("city").value])applyCity();else setStatus("Showing "+FEED.location.name+".",false,true);

buildCast();onData();requestAnimationFrame(frame);connect();
})();
