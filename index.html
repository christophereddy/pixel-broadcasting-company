<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Broadcasting Company</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--bg:#0c0e1c;--panel:#161a33;--edge:#2c3364;--ink:#ece8d6;--dim:#8f93b8;--gold:#f7c948}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{display:flex;flex-direction:column;font-family:"Press Start 2P",ui-monospace,monospace}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;background:var(--panel);border-bottom:3px solid var(--edge)}
.brand{font-size:11px;color:var(--gold);letter-spacing:1px;text-shadow:2px 2px 0 #7a2b10;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switch{display:flex;flex:none;border:2px solid var(--edge)}
.switch button{font:inherit;font-size:11px;padding:9px 14px;background:transparent;color:var(--dim);border:0;cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--gold);color:#1a1300}
.switch button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
iframe{flex:1;width:100%;border:0;display:block;background:var(--bg)}
@media (max-width:480px){.brand{font-size:8px}.switch button{font-size:10px;padding:9px 10px}}
</style>
</head>
<body>
<div class="bar">
  <div class="brand">PIXEL BROADCASTING CO.</div>
  <div class="switch" role="group" aria-label="Choose a channel">
    <button type="button" data-ch="news" aria-pressed="false">NEWS</button>
    <button type="button" data-ch="sports" aria-pressed="false">SPORTS</button>
  </div>
</div>
<iframe id="screen" title="Channel" allow="fullscreen; autoplay" allowfullscreen></iframe>
<script>
(function(){
  var CH={news:"news/",sports:"sports/"},frame=document.getElementById("screen"),btns=document.querySelectorAll(".switch button");
  function pick(){var h=location.hash.slice(1);if(CH[h])return h;try{var s=localStorage.getItem("pbc-channel");if(CH[s])return s}catch(e){}return "news"}
  function show(ch){
    btns.forEach(function(b){b.setAttribute("aria-pressed",b.dataset.ch===ch?"true":"false")});
    if(frame.dataset.ch!==ch){frame.dataset.ch=ch;frame.src=CH[ch];frame.title=ch==="news"?"Pixel news":"Pixel sports"}
    try{localStorage.setItem("pbc-channel",ch)}catch(e){}
    if(location.hash.slice(1)!==ch)history.replaceState(null,"","#"+ch);
  }
  btns.forEach(function(b){b.addEventListener("click",function(){show(b.dataset.ch)})});
  window.addEventListener("hashchange",function(){show(pick())});
  show(pick());
})();
</script>
</body>
</html>
